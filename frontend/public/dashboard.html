<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Sistema Ferretería</title>
  <link rel="stylesheet" href="../src/lib/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="../src/lib/bootstrap-icons/bootstrap-icons.css">
  <link rel="stylesheet" href="../src/css/styles.css">
  <script src="../src/lib/bootstrap/bootstrap.bundle.min.js"></script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar" role="banner">
      <a href="dashboard.html" class="topbar-brand" aria-label="Ferretería - Inicio">
        <span class="topbar-brand-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
            <path d="M2 17l10 5 10-5"></path>
            <path d="M2 12l10 5 10-5"></path>
          </svg>
        </span>
        <span>Ferretería</span>
      </a>
      
      <nav class="topbar-nav" id="topbar-nav" role="navigation" aria-label="Navegación principal">
      </nav>
      
      <div class="topbar-user" id="topbar-user">
      </div>
    </header>
    
    <main class="workspace" role="main">
      <header class="workspace-header">
        <div>
          <h1 class="workspace-title">Dashboard</h1>
          <p class="workspace-subtitle">Resumen de ventas, alertas y métricas clave</p>
        </div>
        <div class="workspace-actions">
          <span id="connection-status" class="badge badge-success d-flex align-items-center gap-1">
            <span class="spinner spinner-sm" style="display:none;"></span>
            <span>Conectado</span>
          </span>
        </div>
      </header>
      
      <div class="kpi-grid" id="kpi-grid" role="region" aria-label="Indicadores clave">
      </div>
      
      <div class="dashboard-grid">
        <section class="chart-container" aria-label="Ventas por día">
          <header class="chart-header">
            <h2 class="chart-title">Ventas últimos 7 días</h2>
          </header>
          <div class="chart-wrapper">
            <canvas id="chart-ventas-dia" aria-label="Gráfico de líneas de ventas por día"></canvas>
          </div>
        </section>
        
        <section class="chart-container" aria-label="Top 5 productos">
          <header class="chart-header">
            <h2 class="chart-title">Top 5 productos vendidos</h2>
          </header>
          <div class="chart-wrapper">
            <canvas id="chart-top-productos" aria-label="Gráfico de barras de top productos"></canvas>
          </div>
        </section>
        
        <section class="alerts-quick" aria-label="Alertas de reposición pendientes">
          <header class="alerts-quick-header">
            <h3 class="alerts-quick-title">Alertas de Reposición Pendientes</h3>
            <a href="alertas.html" class="alerts-quick-link">Ver todas</a>
          </header>
          <div class="alerts-quick-list" id="alerts-quick-list">
            <div class="empty-state" style="padding: var(--space-6);">
              <div class="spinner mx-auto"></div>
              <p class="empty-state-title mt-2">Cargando alertas...</p>
            </div>
          </div>
        </section>
        
        <section class="card" style="grid-column: 1 / -1;" aria-label="Accesos rápidos">
          <header class="card-header">
            <h3 class="card-title" style="margin:0;font-size:0.875rem;">Accesos Rápidos</h3>
          </header>
          <div class="card-body">
            <div class="d-flex gap-3 flex-wrap">
              <a href="venta.html" class="btn btn-primary">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                  <polyline points="14 2 14 8 20 8"></polyline>
                </svg>
                Nueva Venta
              </a>
              <a href="productos.html" class="btn btn-secondary">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                  <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                  <line x1="12" y1="22.08" x2="12" y2="12"></line>
                </svg>
                Productos
              </a>
              <a href="proveedores.html" class="btn btn-secondary">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                  <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                  <line x1="12" y1="22.08" x2="12" y2="12"></line>
                </svg>
                Entradas Proveedores
              </a>
              <a href="alertas.html" class="btn btn-warning">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
                  <line x1="12" y1="9" x2="12" y2="13"></line>
                  <line x1="12" y1="17" x2="12.01" y2="17"></line>
                </svg>
                Alertas y Bitácora
              </a>
            </div>
          </div>
        </section>
      </div>
    </main>
  </div>
  
  <script type="module" src="../src/js/auth.js"></script>
  <script type="module" src="../src/js/dashboard.js"></script>
  <script type="module" src="../src/js/app.js"></script>
  <script src="../src/lib/chartjs/chart.umd.min.js"></script>
</body>
</html>
