name: ferreteria

services:
  db:
    image: postgres:16-alpine
    container_name: ferreteria-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ferreteria}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ferreteria}
      POSTGRES_DB: ${POSTGRES_DB:-ferreteria}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ferreteria} -d ${POSTGRES_DB:-ferreteria}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    container_name: ferreteria-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ferreteria}:${POSTGRES_PASSWORD:-ferreteria}@db:5432/${POSTGRES_DB:-ferreteria}
      SECRET_KEY: ${SECRET_KEY:-cambia-esta-clave-en-produccion}
      AUTO_SEED: "true"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  pgdata:
